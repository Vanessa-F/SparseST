[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsest"
version = "0.1.0"
description = "Multi-objective threshold search for sparse spatio-temporal models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# spconv is deliberately absent: its distribution name encodes the CUDA version
# (spconv-cu120, spconv-cu118, ...), so it must be installed explicitly. See README.
dependencies = [
    "torch>=2.2",
    "numpy>=1.24,<2",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "matplotlib>=3.7",
    "gpytorch>=1.13",
]

[project.optional-dependencies]
# Needed only by the Pareto-front notebooks.
analysis = [
    "botorch>=0.12",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "jupyter",
]

[project.scripts]
sparsest-train = "sparsest.train:main"
sparsest-eval = "sparsest.evaluate:main"
sparsest-search = "sparsest.search:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
